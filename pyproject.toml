[tool.poetry]
name = "esp2dag"
version = "0.1.0"
description = "CA ESP / Broadcom ESP Workload Automation → Apache Airflow DAG Factory YAML compiler (scheduler migration)"
authors = ["Amir Sohel <amirsohelprowork@gmail.com>"]
readme = "README.md"
license = "LicenseRef-Source-Available-NonCommercial"
homepage = "https://github.com/amirsohelprowork-netizen/esp2dag"
repository = "https://github.com/amirsohelprowork-netizen/esp2dag"
documentation = "https://github.com/amirsohelprowork-netizen/esp2dag/blob/main/docs/USAGE.md"
packages = [{ include = "esp2dag", from = "src" }]
keywords = [
    "esp",
    "ca-esp",
    "broadcom-esp",
    "cybermation",
    "workload-automation",
    "apache-airflow",
    "airflow",
    "airflow3",
    "dag-factory",
    "dagfactory",
    "scheduler-migration",
    "mainframe",
    "as400",
    "ibm-i",
    "winrm",
    "sap",
    "batch-scheduling",
    "esp-to-airflow",
    "legacy-modernization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[tool.poetry.scripts]
esp2dag = "esp2dag.cli.app:main"

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0"
typer = "^0.15"
rich = "^13.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
black = "^24.0"
ruff = "^0.5"
mypy = "^1.10"
types-PyYAML = "^6.0"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["esp2dag"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "slow: exercises large real-world ESP schedule files",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
