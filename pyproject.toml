[tool.poetry]
name = "esp2dag"
version = "0.1.0"
description = "Compiler: ESP Workload Automation schedules → DAG Factory YAML / Apache Airflow"
authors = ["ESP to DAG Factory Contributors"]
readme = "README.md"
license = "Apache-2.0"
packages = [{ include = "esp2dag", from = "src" }]
keywords = ["esp", "airflow", "dag-factory", "compiler", "migration", "workload-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
]

[tool.poetry.scripts]
esp2dag = "esp2dag.cli.app:main"

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0"
typer = "^0.15"
rich = "^13.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
black = "^24.0"
ruff = "^0.5"
mypy = "^1.10"
types-PyYAML = "^6.0"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["esp2dag"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "slow: exercises large real-world ESP schedule files",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
