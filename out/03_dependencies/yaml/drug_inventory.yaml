drug_inventory:
  description: DRUG_INVENTORY application
  schedule: '@daily'
  catchup: false
  default_args:
    owner: maestro
    start_date: '2024-01-01'
  tasks:
    wait_inventory_feed:
      operator: custom_operators.mainframe.MainframeDatasetSensor
      dsname: PHARMA.INVENTORY.DAILY.FEED
      mode: reschedule
      poke_interval: 60
    validate_inventory:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: VALIDATE_INVENTORY
      ccchk: (0,4)
      dependencies:
      - wait_inventory_feed
    update_stock_levels:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: UPDATE_STOCK_LEVELS
      dependencies:
      - validate_inventory
    flag_expiring_drugs:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: FLAG_EXPIRING_DRUGS
      dependencies:
      - validate_inventory
    inventory_complete:
      operator: airflow.providers.standard.operators.empty.EmptyOperator
      dependencies:
      - flag_expiring_drugs
      - update_stock_levels
