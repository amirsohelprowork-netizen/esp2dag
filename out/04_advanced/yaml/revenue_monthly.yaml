revenue_monthly:
  description: REVENUE_MONTHLY application
  catchup: false
  default_args:
    owner: maestro
    start_date: '2024-01-01'
  tasks:
    close_revenue_period:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: CLOSE_REVENUE_PERIOD
    calc_deferred_revenue:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: CALC_DEFERRED_REVENUE
      ccchk: (0)
      dependencies:
      - close_revenue_period
    calc_accruals:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: CALC_ACCRUALS
      ccchk: (0)
      dependencies:
      - close_revenue_period
    revenue_reconciliation:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: REVENUE_RECONCILIATION
      ccchk: (0)
      dependencies:
      - calc_accruals
      - calc_deferred_revenue
    management_reporting:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: MANAGEMENT_REPORTING
      dependencies:
      - revenue_reconciliation
