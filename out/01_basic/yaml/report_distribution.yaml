report_distribution:
  description: REPORT_DISTRIBUTION application
  schedule: 0 5 * * *
  catchup: false
  default_args:
    owner: maestro
    start_date: '2024-01-01'
  tasks:
    build_daily_summary:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: BUILD_DAILY_SUMMARY
    print_branch_reports:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: PRINT_BRANCH_REPORTS
      dependencies:
      - build_daily_summary
    print_exec_summary:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: PRINT_EXEC_SUMMARY
      dependencies:
      - build_daily_summary
    archive_reports:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: ARCHIVE_REPORTS
      dependencies:
      - build_daily_summary
