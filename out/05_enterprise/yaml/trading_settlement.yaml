trading_settlement:
  description: TRADING_SETTLEMENT application
  schedule: 0 19 * * 1-5
  catchup: false
  default_args:
    owner: settle_svc
    start_date: '2024-01-01'
  tasks:
    wait_market_data:
      operator: custom_operators.mainframe.MainframeDatasetSensor
      dsname: TRADING.MARKET.PRICES.DAILY
      mode: reschedule
      poke_interval: 60
    wait_core_for_settle:
      operator: airflow.providers.standard.sensors.external_task.ExternalTaskSensor
      external_dag_id: core_banking_eod
      external_task_id: wait_core_for_settle
      mode: reschedule
    ts_match_trades:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: TS_MATCH_TRADES
      dependencies:
      - wait_core_for_settle
      - wait_market_data
    ts_calc_settlement:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: TS_CALC_SETTLEMENT
      ccchk: (0)
      dependencies:
      - ts_match_trades
    ts_process_fails:
      operator: custom_operators.mainframe.MainframeSubmitJobOperator
      job_name: TS_PROCESS_FAILS
      dependencies:
      - ts_calc_settlement
    ts_deliver_securities:
      operator: airflow.providers.ssh.operators.ssh.SSHOperator
      ssh_conn_id: UNIX_SETTLE_01
      command: /opt/trading/scripts/deliver_securities.sh
      dependencies:
      - ts_calc_settlement
    ts_reconcile_positions:
      operator: airflow.providers.ssh.operators.ssh.SSHOperator
      ssh_conn_id: UNIX_SETTLE_01
      command: /opt/trading/scripts/reconcile_positions.ksh
      dependencies:
      - ts_deliver_securities
    ts_settlement_complete:
      operator: airflow.providers.standard.operators.empty.EmptyOperator
      dependencies:
      - ts_reconcile_positions
